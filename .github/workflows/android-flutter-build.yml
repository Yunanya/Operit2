name: Android Flutter Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONUTF8: "1"
      RUST_TOOLCHAIN_VERSION: 1.95.0
      ANDROID_V8_NDK_VERSION: 28.2.13676358

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-7]* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Restore Android V8 artifacts
        id: v8cache
        uses: actions/cache@v4
        with:
          path: tools/release/work/android-v8/*/aarch64-linux-android
          key: linux-android-v8-artifacts-ndk${{ env.ANDROID_V8_NDK_VERSION }}-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Install LLVM 21 (libclang, lld)
        if: steps.v8cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libclang-21-dev lld-21
          lib=/usr/lib/llvm-21/lib
          if ! ls $lib/libclang.so.2[1-9]* >/dev/null 2>&1; then
            src=$(ls $lib/libclang-21.so.* /usr/lib/x86_64-linux-gnu/libclang-21.so.* 2>/dev/null | head -n1)
            sudo ln -sf "$src" $lib/libclang.so.21
          fi
          ls -l $lib/libclang* /usr/lib/llvm-21/bin/ld.lld

      - name: Install Android NDK
        if: steps.v8cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_V8_NDK_VERSION" > /dev/null
          echo "OPERIT_ANDROID_V8_NDK=$ANDROID_HOME/ndk/$ANDROID_V8_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        if: steps.v8cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Build Android V8 from source
        if: steps.v8cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/build_scripts/prepare_android_v8.py --target aarch64-linux-android --env-file "$RUNNER_TEMP/v8.env"
          cat "$RUNNER_TEMP/v8.env"
          rm -rf tools/release/work/android-v8/*/build tools/release/work/android-v8/*/probe

      - name: Upload Android V8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-v8-${{ github.sha }}
          path: tools/release/work/android-v8/*/aarch64-linux-android/
          if-no-files-found: error
          retention-days: 3

  build-android:
    needs: [build-android-runtime, build-android-v8]
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      ANDROID_V8_NDK_VERSION: 28.2.13676358

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare plugin build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          if ($LASTEXITCODE -ne 0) { throw "typescript install failed" }
          corepack enable pnpm
          Push-Location plugins/packages/buildin/workflow
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "workflow plugin install failed" }
          Pop-Location

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $required = @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "ANDROID_RELEASE_STORE_PASSWORD",
            "ANDROID_RELEASE_KEY_ALIAS",
            "ANDROID_RELEASE_KEY_PASSWORD"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          if ($missing.Count -gt 0) {
            Write-Host "Signing secrets missing ($($missing -join ', ')); generating a throwaway keystore for this fork build."
            $env:ANDROID_RELEASE_STORE_PASSWORD = "operit2fork"
            $env:ANDROID_RELEASE_KEY_PASSWORD = "operit2fork"
            $env:ANDROID_RELEASE_KEY_ALIAS = "operit2fork"
            & keytool -genkeypair -v -keystore $keystore -storetype PKCS12 -alias operit2fork -keyalg RSA -keysize 2048 -validity 10000 -storepass operit2fork -keypass operit2fork -dname "CN=Operit2 Fork, O=Yunanya, C=CN"
            if ($LASTEXITCODE -ne 0) { throw "keytool failed" }
          } else {
            [System.IO.File]::WriteAllBytes($keystore, [System.Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
          }
          @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$env:ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$env:ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$env:ANDROID_RELEASE_KEY_PASSWORD
          "@ | Set-Content -Path (Join-Path $secretsDir "android-signing.properties") -Encoding utf8

      - name: Download Linux-built Android V8
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-v8-${{ github.sha }}
          path: tools/release/work/android-v8

      - name: Pin Android NDK for V8 cache match
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          "y`ny`ny`ny`n" | & $sdkmanager --install "ndk;$env:ANDROID_V8_NDK_VERSION" | Out-Null
          $ndk = Join-Path $env:ANDROID_HOME "ndk\$env:ANDROID_V8_NDK_VERSION"
          if (-not (Test-Path -LiteralPath $ndk)) { throw "NDK not installed at $ndk" }
          "OPERIT_ANDROID_V8_NDK=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -Recurse tools/release/work/android-v8 | Select-Object FullName, Length

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Build and package Android app
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14
